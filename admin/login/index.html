<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | One Stop Renew Portal</title><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/admin-standalone.css"></head><body class="admin-login-page"><main class="admin-login-card"><p class="admin-eyebrow">One Stop Renew Portal</p><h1>Admin Login</h1><form id="admin-login-form"><label><span>Password</span><input id="admin-password" type="password" autocomplete="current-password" required autofocus></label><button class="admin-button admin-button-primary" type="submit">Login</button><p id="admin-login-message" class="admin-login-message" aria-live="polite"></p></form><p class="admin-config-note">This login uses your Vercel ADMIN_PASSWORD and standalone session cookie.</p></main><script>
(async()=>{const s=await fetch('/api/admin-session',{credentials:'same-origin'}).then(r=>r.json()).catch(()=>({}));if(s.authenticated){location.replace('/admin/');return;}document.querySelector('#admin-login-form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.querySelector('#admin-login-message');msg.textContent='';const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.querySelector('#admin-password').value})});const j=await r.json().catch(()=>({}));if(r.ok)location.replace('/admin/');else msg.textContent=j.error||'Login failed.';});})();
</script></body></html>
