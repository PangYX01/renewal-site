<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSR Admin</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#1f2937}.wrap{max-width:1180px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px}button{cursor:pointer;background:#111827;color:#fff}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{background:#f9fafb}.muted{color:#6b7280}.error{color:#b91c1c}.ok{color:#047857}a{color:inherit}</style></head><body><div class="wrap"><h1>OSR Admin</h1><div id="login" class="card"><h2>Admin login</h2><div class="row"><input id="pw" type="password" placeholder="Admin password"><button id="loginBtn">Login</button></div><p id="loginMsg" class="muted"></p></div><div id="app" hidden><div class="card row"><a href="/reports/"><button>Reports</button></a><button id="refresh">Refresh</button><button id="logout">Logout</button><span id="status" class="muted"></span></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Status</th><th>Registration</th><th>Business</th><th>Customer</th><th>Years</th><th>Branches</th><th>Total</th><th>Payment</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>
const $=s=>document.querySelector(s);async function session(){const r=await fetch('/api/admin-session');return r.json()}async function render(){const s=await session();$('#login').hidden=s.authenticated;$('#app').hidden=!s.authenticated;if(s.authenticated)load()}async function load(){const r=await fetch('/api/admin-records');const j=await r.json();if(!r.ok){$('#status').textContent=j.error||'Unable to load';return}$('#status').textContent=(j.records||[]).length+' records';$('#rows').innerHTML=(j.records||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.status||''}</td><td>${x.registration_number||''}</td><td>${x.business_name||''}</td><td>${x.customer_name||''}</td><td>${x.renewal_years||''}</td><td>${x.branches??''}</td><td>RM${Number(x.total_amount||0).toFixed(2)}</td><td>${x.payment_method||''}</td></tr>`).join('')}$('#loginBtn').onclick=async()=>{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const j=await r.json();$('#loginMsg').textContent=r.ok?'':(j.error||'Login failed');if(r.ok)render()};$('#refresh').onclick=load;$('#logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});render()};render();
</script></body></html>
