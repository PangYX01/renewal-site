<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSR Reports</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#1f2937}.wrap{max-width:1080px;margin:40px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}.n{font-size:30px;font-weight:700;margin-top:8px}.muted{color:#6b7280}a{color:#111827}</style></head><body><div class="wrap"><p><a href="/admin/">← Admin</a></p><h1>Reports</h1><div id="msg" class="muted"></div><div id="grid" class="grid"></div></div><script>async function load(){const r=await fetch('/api/reports-overview');const j=await r.json();if(!r.ok){document.querySelector('#msg').textContent=j.error||'Unable to load reports.';return}const cards=[['Submissions',j.submissions],['Paid',j.paid],['Pending',j.pending],['Failed',j.failed],['Refunded',j.refunded],['Revenue','RM'+Number(j.revenue||0).toFixed(2)]];document.querySelector('#grid').innerHTML=cards.map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="n">${b}</div></div>`).join('')}load();</script></body></html>
